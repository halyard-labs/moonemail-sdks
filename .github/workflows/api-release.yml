name: Release new API version
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: api-version-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.x'
      - run: pip install -r requirements-codegen.txt
      - id: prepare
        run: python scripts/prepare-release.py
      - if: steps.prepare.outputs.changed == 'true'
        run: |
          npm ci --ignore-scripts --prefix typescript
          npm run build --prefix typescript
          node --test tests/typescript.test.cjs
          typescript/node_modules/.bin/tsc --noEmit --strict --lib es2022,dom tests/typescript-types.ts
          pip install ./python
          python -m unittest discover -s tests -v
          (cd go && go test ./... && go vet ./...)
      - name: Commit and tag tested contract
        if: steps.prepare.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec config typescript python go
          git commit -m "Release API ${VERSION} clients"
          git tag "v${VERSION}"
          git tag "go/v${VERSION}"
          git push --atomic origin HEAD:main "v${VERSION}" "go/v${VERSION}"
      # GITHUB_TOKEN tag pushes do not trigger other workflows. Dispatch explicitly,
      # including on a retry where the tags exist but publishing previously failed.
      - name: Publish current version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          PYPI_ENABLED: ${{ vars.PYPI_PUBLISHING_ENABLED }}
        run: |
          python - <<'PYTHON'
          import json, os, subprocess
          from urllib.error import HTTPError
          from urllib.request import urlopen
          version = os.environ['VERSION']
          missing = False
          urls = [f'https://registry.npmjs.org/moonemail/{version}']
          if os.environ['PYPI_ENABLED'] == 'true':
              urls.append(f'https://pypi.org/pypi/moonemail/{version}/json')
          for url in urls:
              try:
                  with urlopen(url, timeout=30) as r: json.load(r)
              except HTTPError as e:
                  if e.code != 404: raise
                  missing = True
          if missing:
              subprocess.run(['gh','workflow','run','release.yml','--ref','main','-f',f'version={version}'], check=True)
          else:
              print('All enabled registries already contain this version')
          PYTHON
