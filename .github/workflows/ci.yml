name: SDK checks
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: sdk-checks-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-codegen.txt
            python/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go/go.sum
      - run: pip install -r requirements-codegen.txt build
      - run: python scripts/check-generated.py
      - run: npm ci --ignore-scripts --prefix typescript && npm run build --prefix typescript
      - run: node --test tests/typescript.test.cjs
      - run: typescript/node_modules/.bin/tsc --noEmit --strict --lib es2022,dom tests/typescript-types.ts
      - run: pip install ./python && python -m unittest discover -s tests -v
      - run: cd go && go test ./... && go vet ./...
      - run: mkdir -p artifacts && npm pack ./typescript --pack-destination artifacts
      - run: python -m build python --outdir artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: moonemail-sdk-packages
          path: artifacts/
